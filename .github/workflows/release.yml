name: Release

# 每次提交到 main 就自动发一个测试版 Release。
#
#   git push origin main   ->   v0.1.0-beta.<提交数>
#
# 版本号从 VERSION 文件（基线）+ main 上的提交数（构建号）拼出来，全自动，
# 不需要手工打 tag。见 VERSION 文件里的说明。
#
# 想换成「打 tag 才发版」的话，把下面的 push.branches 换成 push.tags: ['v*']，
# 并把「计算版本号」那一步改成直接用 GITHUB_REF_NAME。
on:
  push:
    branches: [main]
  workflow_dispatch:

# gh release create 需要写权限（它会顺手把 tag 建出来）。
# GITHUB_TOKEN 由 runner 自动注入，不需要在仓库里配任何 secret。
permissions:
  contents: write

env:
  # 交叉编译不需要 cgo：关掉之后产物不依赖目标平台的 C 运行时，
  # 一个 Linux runner 就能编出全部平台。这也是设计文档里定的方式。
  CGO_ENABLED: '0'

jobs:
  # 版本号单独算一次，给后面的 job 用。
  #
  # 不放在 build 里各算各的：四个 job 各算一遍，一旦算法有偏差
  # 就会出现「产物的版本号和 Release 标题对不上」这种极难查的问题。
  version:
    name: 计算版本号
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # 必须是完整历史：git rev-list --count 在浅克隆（默认 fetch-depth: 1）
          # 下只会返回 1，版本号会永远停在 beta.1。
          fetch-depth: 0

      - name: 拼出版本号
        id: calc
        run: |
          set -eu
          # VERSION 文件里带注释，取第一条非注释非空的行。
          base="$(grep -v '^[[:space:]]*#' VERSION | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')"
          if [ -z "$base" ]; then
            echo "VERSION 文件里没读到版本基线" >&2
            exit 1
          fi
          build="$(git rev-list --count HEAD)"
          echo "version=v${base}.${build}" >> "$GITHUB_OUTPUT"
          echo "版本号：v${base}.${build}（基线 ${base} + 第 ${build} 次提交）"

  # 提交不等于代码是好的。发版前把和 CI 一样的检查再跑一遍，
  # 免得一个编译不过的提交直接变成 Release。
  verify:
    name: 发版前检查
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...

      # 注意：这一步要 cgo，所以得把上面的 CGO_ENABLED=0 覆盖回来。
      - name: 单元测试
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

  build:
    name: 编译 ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: [version, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      # 一个平台挂了别把其它平台也取消掉 —— 全量失败信息一次看全，
      # 比一次只暴露一个错误省好几轮。
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: arm64
            ext: ''
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: 编译
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -eu
          version='${{ needs.version.outputs.version }}'
          name="clichat-${GOOS}-${GOARCH}${{ matrix.ext }}"
          mkdir -p dist
          # -trimpath 去掉构建机上的绝对路径，产物可复现。
          # -s -w 去掉符号表和 DWARF：发布产物不需要，能小一圈。
          # main.version 会被 IMAP 的 ID 命令一并用上（见 mail.SetClientIDVersion），
          # 所以服务端看到的版本和 -version 打印的一致。
          go build -trimpath \
            -ldflags "-s -w -X main.version=${version}" \
            -o "dist/${name}" .
          ls -l "dist/${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: clichat-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: 发 Release
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # 六个平台的产物汇到一个目录。各 job 的 artifact 名不同，
      # merge-multiple 会把它们解到同一层，不会互相覆盖（文件名带平台后缀）。
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        working-directory: dist
        run: |
          set -eu
          sha256sum ./* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 用 runner 自带的 gh 而不是第三方 release action：
      # 少一个要信任的依赖，权限也只用 GITHUB_TOKEN。
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -eu

          # 同一个提交重跑 CI 时会算出同一个版本号，此时 Release 可能已经在了。
          # 这种情况改成覆盖上传资产，而不是让整个 job 红掉 —— 版本号是
          # 从 git 推出来的，重跑本来就该更新同一个 Release。
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION 已存在，覆盖上传资产"
            gh release upload "$VERSION" ./dist/* --clobber
          else
            # --target 让 gh 顺手把 tag 建在这一次的提交上，不用额外 git tag + push。
            # --prerelease：现在是测试版，不该占住仓库的「Latest」。
            gh release create "$VERSION" ./dist/* \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --generate-notes \
              --prerelease
          fi
